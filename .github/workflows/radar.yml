name: radar

# Refreshes the PreStocks Meme Radar every six hours and publishes it through GitHub Pages (docs/).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect and render
        run: node radar/radar.mjs
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Commit the new snapshot
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "radar: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
